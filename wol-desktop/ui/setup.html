<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OfflineWOL — Setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --error: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: #334155;
          --accent: #3b82f6;
          --accent-hover: #2563eb;
          --error: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: calc(24px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .brand img {
        border-radius: 8px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }
      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input[type="url"] {
        width: 100%;
        padding: 11px 14px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      input[type="url"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }
      .hint {
        margin: 8px 0 20px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
      }
      .hint code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      button {
        width: 100%;
        padding: 11px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        margin-top: 14px;
        font-size: 13px;
        min-height: 18px;
        color: var(--muted);
      }
      .status.error {
        color: var(--error);
      }
      @media (max-width: 480px), (pointer: coarse) {
        .card {
          padding: 24px 20px;
        }
        input[type="url"] {
          min-height: 44px;
          font-size: 16px;
        }
        button {
          min-height: 44px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="icons/icon-48.png" alt="" width="36" height="36">
        <h1>OfflineWOL</h1>
      </div>
      <p class="subtitle">
        Enter your online library URL with your preferred language to set up offline browsing and highlights.
      </p>
      <form id="setup-form">
        <label for="library-url">Library URL</label>
        <input
          id="library-url"
          type="url"
          placeholder="https://example.org/es"
          autocomplete="url"
          autofocus
          required
        >
        <p class="hint">
          Paste either the short language URL (e.g. <code>https://…/es</code>) or the full home URL (e.g. <code>https://…/es/wol/h/r4/lp-s</code>).
        </p>
        <button id="submit-btn" type="submit">Continue</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </main>

    <script>
      const tauriInvoke = window.__TAURI_INTERNALS__?.invoke;
      const form = document.getElementById("setup-form");
      const input = document.getElementById("library-url");
      const btn = document.getElementById("submit-btn");
      const status = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const rawUrl = input.value.trim();
        if (!rawUrl || !tauriInvoke) return;

        btn.disabled = true;
        status.className = "status";
        status.textContent = "Connecting and detecting language…";

        try {
          await tauriInvoke("setup_from_url", { rawUrl });
        } catch (err) {
          btn.disabled = false;
          status.className = "status error";
          status.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
