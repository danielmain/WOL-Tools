<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>WOL Highlights</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" width="28" height="28">
      <div>
        <h1>WOL Highlights</h1>
        <p>JW Library marks on wol.jw.org</p>
      </div>
    </header>

    <div class="actions">
      <label class="file">
        <input id="file" type="file" accept=".jwlibrary,.db,.sqlite,.zip,.json,application/octet-stream,application/json">
        <span>Load backup</span>
      </label>
      <button id="open-tab-btn" type="button" class="btn-tab">⤢ Open in tab</button>
    </div>
    <p class="hint">On macOS, switching apps closes this popup. Click <strong><a id="open-tab" href="#">Open in tab</a></strong> to drag &amp; drop or select files in a permanent tab.</p>

    <section id="loaded" hidden>
      <p id="file-name"></p>
      <p id="counts"></p>
      <ul id="colors"></ul>
      <label class="toggle">
        <input id="enabled" type="checkbox">
        <span>Show highlights</span>
      </label>
      <div class="loaded-actions">
        <button id="export-json" type="button" class="btn-secondary">Export highlights</button>
        <button id="remove" type="button">Remove highlights</button>
      </div>
    </section>

    <section id="page">
      <h2>This page</h2>
      <p id="page-status">Open an article on wol.jw.org.</p>
    </section>

    <p id="message" role="status"></p>
    <script src="lib/sql-wasm.js"></script>
    <script src="lib/backup.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
